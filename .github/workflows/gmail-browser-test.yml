name: temporary Gmail browser test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: run Gmail bootstrap and API test
        env:
          GMAIL_TEST_EMAIL: ${{ secrets.GMAIL_TEST_EMAIL }}
          GMAIL_TEST_PASSWORD: ${{ secrets.GMAIL_TEST_PASSWORD }}
          GMAIL_TEST_RECOVERY_EMAIL: ${{ secrets.GMAIL_TEST_RECOVERY_EMAIL }}
          GMAIL_TEST_2FA: ${{ secrets.GMAIL_TEST_2FA }}
          GMAIL_TEST_CLIENT_ID: ${{ secrets.GMAIL_TEST_CLIENT_ID }}
          GMAIL_TEST_CLIENT_SECRET: ${{ secrets.GMAIL_TEST_CLIENT_SECRET }}
        run: node gmail-browser-harness.mjs
